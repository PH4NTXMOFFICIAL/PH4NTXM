<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="ph4ntxm">
    <deny send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager.Seat" send_member="SwitchToGreeter"/>
    <deny send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager.Seat" send_member="SwitchToUser"/>
    <deny send_destination="org.freedesktop.DisplayManager" send_interface="org.freedesktop.DisplayManager.Seat" send_member="SwitchToGuest"/>
  </policy>
</busconfig>
