name: PH4NTXM Abyss Edition Official ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed release tag to build (for example v3.5.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: official-abyss-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-abyss:
    if: github.ref == 'refs/heads/main'
    environment: sourceforge-release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release source and upload configuration
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          SOURCEFORGE_SSH_PASSPHRASE: ${{ secrets.SOURCEFORGE_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a release tag such as v3.5.2." >&2; exit 1; }
          test -n "$SOURCEFORGE_SSH_PRIVATE_KEY" || { echo "Missing SOURCEFORGE_SSH_PRIVATE_KEY." >&2; exit 1; }
          test -n "$SOURCEFORGE_SSH_PASSPHRASE" || { echo "Missing SOURCEFORGE_SSH_PASSPHRASE." >&2; exit 1; }
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          fingerprint=$(gpg --show-keys --with-colons ph4ntxm-public-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = "673E98A65A905B7237455C6A7FA9BAE506F90406"
          gpg --batch --import ph4ntxm-public-key.asc
          git verify-tag "$RELEASE_TAG"
          git verify-commit "$RELEASE_TAG^{commit}"
          git checkout --detach "$RELEASE_TAG^{commit}"

      - name: Show source revision
        run: |
          git rev-parse HEAD
          git status --short

      - name: Build Abyss on Debian 13
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:13 \
            bash -lc '
              set -euo pipefail

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                git \
                live-build \
                python3 \
                util-linux \
                ca-certificates

              ./build.sh --edition abyss
              chmod a+r build/abyss/ph4ntxm-abyss-amd64.* build/abyss/SHA256SUMS
            '

      - name: Show build outputs
        run: |
          ls -lh build/abyss/ph4ntxm-abyss-amd64.* build/abyss/SHA256SUMS
          cd build/abyss
          sha256sum --check SHA256SUMS

      - name: Upload PH4NTXM Abyss Edition Official ISO
        uses: actions/upload-artifact@v7
        with:
          name: ph4ntxm-abyss-official-${{ inputs.release_tag }}
          path: |
            build/abyss/ph4ntxm-abyss-amd64.*
            build/abyss/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish Official ISO to SourceForge
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          SOURCEFORGE_SSH_PASSPHRASE: ${{ secrets.SOURCEFORGE_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/sourceforge-ssh.XXXXXX")
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -rf "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$SOURCEFORGE_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          unset SOURCEFORGE_SSH_PRIVATE_KEY
          printf '#!/bin/sh\nprintf "%%s\n" "$SOURCEFORGE_SSH_PASSPHRASE"\n' > "$ssh_dir/askpass"
          chmod 700 "$ssh_dir/askpass"
          ssh-keyscan -T 30 -t ed25519 frs.sourceforge.net > "$ssh_dir/known_hosts"
          fingerprint=$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "$fingerprint" = "SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY"
          eval "$(ssh-agent -s)"
          DISPLAY=:0 SSH_ASKPASS_REQUIRE=force SSH_ASKPASS="$ssh_dir/askpass" ssh-add "$ssh_dir/key" < /dev/null
          unset SOURCEFORGE_SSH_PASSPHRASE
          rm -f "$ssh_dir/key" "$ssh_dir/askpass"
          cat > "$ssh_dir/config" <<EOF
          Host frs.sourceforge.net
            User ph4ntxmofficial
            BatchMode yes
            StrictHostKeyChecking yes
            HostKeyAlgorithms ssh-ed25519
            UserKnownHostsFile $ssh_dir/known_hosts
            GlobalKnownHostsFile /dev/null
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          sftp -F "$ssh_dir/config" -b - frs.sourceforge.net <<EOF
          cd /home/frs/project/ph4ntxmofficial
          -mkdir $RELEASE_TAG
          cd $RELEASE_TAG
          -mkdir abyss
          cd abyss
          EOF
          destination="ph4ntxmofficial@frs.sourceforge.net:/home/frs/project/ph4ntxmofficial/$RELEASE_TAG/abyss/"
          rsync -rtp --partial --chmod=F644 -e "ssh -F $ssh_dir/config" \
            build/abyss/ph4ntxm-abyss-amd64.hybrid.iso "$destination"
          rsync -rtp --chmod=F644 -e "ssh -F $ssh_dir/config" \
            build/abyss/SHA256SUMS "$destination"
          printf 'Official ISO: https://sourceforge.net/projects/ph4ntxmofficial/files/%s/abyss/\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null); then
            printf 'Release already exists: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notes=$(mktemp "$RUNNER_TEMP/ph4ntxm-release-notes.XXXXXX")
          trap 'rm -f "$notes"' EXIT
          download_url="https://sourceforge.net/projects/ph4ntxmofficial/files/$RELEASE_TAG/abyss"
          printf '%s\n' \
            '## Downloads' \
            '' \
            "- [PH4NTXM Abyss Edition ISO]($download_url/ph4ntxm-abyss-amd64.hybrid.iso/download)" \
            "- [SHA256SUMS]($download_url/SHA256SUMS/download)" \
            '' \
            'Download both files into the same directory and run `sha256sum --check SHA256SUMS` before preparing live media.' \
            '' > "$notes"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "PH4NTXM $RELEASE_TAG" \
            --generate-notes \
            --notes-file "$notes"
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          printf 'Review and publish the release draft: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
