name: Build PH4NTXM Abyss Edition Test ISO

on:
  workflow_dispatch:

jobs:
  build-abyss:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Show source revision
        run: |
          git rev-parse HEAD
          git status --short

      - name: Build Abyss on Debian 13
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:13 \
            bash -lc '
              set -euo pipefail

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                git \
                live-build \
                python3 \
                util-linux \
                ca-certificates

              ./build.sh --edition abyss
              chmod a+r build/abyss/ph4ntxm-abyss-amd64.* build/abyss/SHA256SUMS
            '

      - name: Show build outputs
        run: |
          ls -lh build/abyss/ph4ntxm-abyss-amd64.* build/abyss/SHA256SUMS
          cd build/abyss
          sha256sum --check SHA256SUMS

      - name: Upload PH4NTXM Abyss Edition Test ISO
        uses: actions/upload-artifact@v7
        with:
          name: ph4ntxm-abyss-test-${{ github.sha }}
          path: |
            build/abyss/ph4ntxm-abyss-amd64.*
            build/abyss/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
